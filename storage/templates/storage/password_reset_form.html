{% extends "storage/base.html" %}
{% block title %}忘記密碼{% endblock %}

{% block content %}
<div class="card narrow">
  <h2>忘記密碼</h2>
  <p class="muted">輸入帳號確認過的 Email，我們會寄出重設密碼的連結。</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">寄出重設連結</button>
    <a class="btn" href="{% url 'storage:login' %}">回到登入</a>
  </form>
</div>
{% endblock %}
