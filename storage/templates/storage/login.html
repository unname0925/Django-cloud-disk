{% extends "storage/base.html" %}
{% block title %}登入{% endblock %}

{% block content %}
<div class="card">
  <h2>登入</h2>
  {% if not locked %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">登入</button>
    </form>
  {% endif %}
</div>
{% endblock %}
