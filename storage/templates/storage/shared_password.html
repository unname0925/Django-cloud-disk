{% extends "storage/base.html" %}
{% block title %}需要密碼{% endblock %}

{% block content %}
<div class="card narrow">
  <h2>🔒 這個分享需要密碼</h2>
  {% if locked %}
    <p>密碼錯誤次數過多，請稍後再試。</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">確認</button>
    </form>
  {% endif %}
</div>
{% endblock %}
