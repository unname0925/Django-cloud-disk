{% extends "storage/base.html" %}
{% block title %}設定新密碼{% endblock %}

{% block content %}
<div class="card narrow">
  {% if validlink %}
    <h2>設定新密碼</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">變更密碼</button>
    </form>
  {% else %}
    <h2>連結無效</h2>
    <p>這個重設連結已經過期或使用過了，請重新申請。</p>
    <a class="btn btn-primary" href="{% url 'storage:password_reset' %}">重新申請</a>
  {% endif %}
</div>
{% endblock %}
