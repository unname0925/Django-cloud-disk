{% extends "storage/base.html" %}
{% block title %}{{ file.original_name }}{% endblock %}

{% block content %}
<div class="card">
  <h2>{{ file.original_name }}</h2>
  <p class="muted">
    大小 {{ file.file_size|filesizeformat }}
    {% if link.expires_time %} · 連結有效至 {{ link.expires_time|date:"Y-m-d H:i" }}{% endif %}
  </p>
  <a class="btn btn-primary" href="{% url 'storage:shared_download' link.token %}">下載檔案</a>
</div>
{% endblock %}
