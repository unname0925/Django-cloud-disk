{% extends "storage/base.html" %}
{% block title %}已寄出重設連結{% endblock %}

{% block content %}
<div class="card narrow">
  <h2>請檢查你的信箱</h2>
  <p>如果這個 Email 屬於某個已確認信箱的帳號，我們已經寄出重設密碼的連結，1 小時內有效。</p>
  <p class="muted">沒收到的話，請檢查垃圾郵件匣，或確認輸入的是帳號設定中確認過的 Email。</p>
  <a class="btn" href="{% url 'storage:login' %}">回到登入</a>
</div>
{% endblock %}
