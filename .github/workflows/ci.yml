name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件
        run: |
          pip install -r requirements.txt pyflakes
          sudo apt-get update && sudo apt-get install -y rclone
      - name: 靜態檢查
        run: pyflakes $(git ls-files '*.py' | grep -v /migrations/)
      - name: 檢查 migration 是否齊全
        run: python manage.py makemigrations --check --dry-run
      - name: 執行測試
        run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 建立映像檔
        run: docker build -t cloud-disk .
      - name: 啟動容器並確認服務正常
        run: |
          docker run -d --name web -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-secret -e SECRET_URL_PREFIX=ci -e ALLOWED_HOSTS=localhost \
            cloud-disk
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/ci/login/; then
              echo "服務已啟動"
              docker exec web python manage.py backup
              docker exec web rclone version
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1
      - name: 確認 Docker 健康檢查回報 healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' web)
            echo "健康狀態：$status"
            if [ "$status" = "healthy" ]; then
              docker exec web python deploy/healthcheck.py
              exit 0
            fi
            sleep 3
          done
          docker inspect --format '{{json .State.Health}}' web
          docker logs web
          exit 1
      - name: 驗證 Caddyfile
        run: |
          for file in Caddyfile Caddyfile.local; do
            docker run --rm -e DOMAIN=example.com -v "$PWD/deploy/$file:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
