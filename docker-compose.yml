services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      USE_HTTPS: "True"
      TRUST_PROXY_HEADERS: "True"
    volumes:
      - data:/data
      - backups:/backups
      # rclone 的設定檔（用 rclone config 建立），上傳備份到雲端時使用
      - ./rclone:/config/rclone
      # 把外接硬碟或 NAS 掛進來，並在 .env 設定 BACKUP_COPY_DIR=/offsite
      # - /mnt/usb-backup:/offsite
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
